name: Check math and publish game
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the game
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check math and game logic
        run: node tests/checks.cjs
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p public-site
          cp index.html styles.css math.js app.js favicon.svg .nojekyll public-site/
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
